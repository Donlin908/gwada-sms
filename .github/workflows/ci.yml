name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Principe du moindre privilège : lecture seule sur le repo
permissions:
  contents: read

# Annule les runs redondants sur push rapides successifs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      - name: Type-check (tsc)
        run: node_modules/.bin/tsc --noEmit --skipLibCheck

      - name: Tests (vitest)
        run: npm test
        env:
          NODE_ENV: development

      - name: Build (production)
        run: npm run build
        env:
          NODE_ENV: production
