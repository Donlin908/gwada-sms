name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check:
    name: Type-check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install
        env:
          NODE_ENV: development

      - name: Type-check (tsc)
        run: npx tsc --noEmit --skipLibCheck

      - name: Tests (vitest)
        run: npm test
